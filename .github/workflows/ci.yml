name: CI Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  # ==================== 代码质量检查 ====================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Python 项目检查
      - name: Set up Python
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov
      
      - name: Run Ruff (Python)
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        run: |
          ruff check . --output-format=github --fix || true
          ruff format --check . || true
      
      - name: Type check with mypy
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        run: |
          mypy . --ignore-missing-imports || true

  # ==================== 安全扫描（简化版） ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 检查密钥泄露
      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true
      
      # Python 依赖安全检查
      - name: Safety check
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          pip install safety
          safety check --json || true
        continue-on-error: true

  # ==================== 测试 ====================
  test:
    name: Run Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
      
      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term --verbose
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
      
      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/

  # ==================== 构建检查（简化版） ====================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: |
          if [ -f pyproject.toml ]; then
            python -m build
          elif [ -f setup.py ]; then
            python setup.py sdist bdist_wheel
          else
            echo "No build configuration found, skipping..."
            exit 0
          fi
      
      - name: Check package
        run: |
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            twine check dist/*
          fi
        continue-on-error: true

  # ==================== 性能基准测试 ====================
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
      
      - name: Run benchmarks
        run: |
          pytest --benchmark-only --benchmark-autosave || echo "No benchmarks found"
        continue-on-error: true

  # ==================== PR 报告 ====================
  report:
    name: PR Report
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    if: always()
    
    steps:
      - name: Generate PR report
        run: |
          echo "## 🧪 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code Quality: Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Security Scan: Completed" >> $GITHUB_STEP_SUMMARY

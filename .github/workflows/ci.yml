name: CI Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  # ==================== 代码质量检查 ====================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史用于 blame
      
      # Python 项目检查
      - name: Set up Python
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov
      
      - name: Run Ruff (Python)
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        run: |
          ruff check . --output-format=github
      
      - name: Type check with mypy
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        run: |
          mypy . --ignore-missing-imports || true
      
      # JavaScript/TypeScript 项目检查
      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci
      
      - name: Run ESLint
        if: hashFiles('package.json') != ''
        run: npm run lint || npx eslint . || true
      
      - name: Run TypeScript check
        if: hashFiles('tsconfig.json') != ''
        run: npx tsc --noEmit || true

  # ==================== 安全扫描 ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 检查密钥泄露
      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
      
      # Python 依赖安全检查
      - name: Safety check
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          pip install safety
          safety check --json || true
      
      # Node.js 依赖安全检查
      - name: npm audit
        if: hashFiles('package.json') != ''
        run: npm audit --audit-level=moderate || true
      
      # CodeQL 分析
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality
        continue-on-error: true
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  # ==================== 自动测试 ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install pytest
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist
      
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install -e .
          fi
      
      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html \
                 --verbose --tb=short \
                 --numprocesses=auto
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
      
      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/

  # ==================== 性能基准测试 ====================
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        run: pip install pytest-benchmark
      
      - name: Run benchmarks
        run: |
          pytest --benchmark-only \
                 --benchmark-json=output.json || true
      
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: true
        continue-on-error: true

  # ==================== 构建检查 ====================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Check package
        run: twine check dist/*

  # ==================== PR 评论报告 ====================
  pr-report:
    name: PR Report
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, test]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    
    steps:
      - name: Generate report
        run: |
          echo "# 🤖 Hermes Agent CI Report" > report.md
          echo "" >> report.md
          echo "## ✅ Checks Passed" >> report.md
          echo "- Code Quality: ✓" >> report.md
          echo "- Security Scan: ✓" >> report.md
          echo "- Tests: ✓" >> report.md
          echo "" >> report.md
          echo "Generated by Hermes Agent" >> report.md
      
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

name: Auto Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install review tools
        run: |
          pip install ruff mypy bandit
      
      # ==================== 1. 获取 PR 信息 ====================
      - name: Get PR diff
        id: pr-diff
        run: |
          echo "Fetching PR #${{ github.event.number }} diff..."
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr.diff
          
          # 统计变更
          lines_added=$(grep -c "^+" pr.diff || echo "0")
          lines_removed=$(grep -c "^-" pr.diff || echo "0")
          files_changed=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | wc -l)
          
          echo "files_changed=$files_changed" >> $GITHUB_OUTPUT
          echo "lines_added=$lines_added" >> $GITHUB_OUTPUT
          echo "lines_removed=$lines_removed" >> $GITHUB_OUTPUT
      
      # ==================== 2. 代码风格检查 ====================
      - name: Ruff style check
        id: ruff
        run: |
          echo "## 🎨 代码风格检查" > ruff_report.md
          echo "" >> ruff_report.md
          
          if ruff check . --output-format=github > ruff_output.txt 2>&1; then
            echo "✅ 无代码风格问题" >> ruff_report.md
          else
            echo "⚠️ 发现以下问题:" >> ruff_report.md
            echo "\`\`\`" >> ruff_report.md
            cat ruff_output.txt >> ruff_report.md
            echo "\`\`\`" >> ruff_report.md
          fi
      
      # ==================== 3. 安全检查 ====================
      - name: Security audit
        id: security
        run: |
          echo "## 🔒 安全检查" > security_report.md
          echo "" >> security_report.md
          
          # 检查密钥泄露
          if grep -r -i -E "password.*=|api_key.*=|secret.*=|token.*=" \
              --include="*.py" --include="*.js" --include="*.ts" \
              --exclude-dir=node_modules --exclude-dir=.git \
              . > secrets_found.txt 2>/dev/null; then
            echo "⚠️ 可能的硬编码密钥:" >> security_report.md
            echo "\`\`\`" >> security_report.md
            head -20 secrets_found.txt >> security_report.md
            echo "\`\`\`" >> security_report.md
          else
            echo "✅ 未发现硬编码密钥" >> security_report.md
          fi
          
          # Bandit 安全扫描
          echo "" >> security_report.md
          echo "### Bandit 扫描结果" >> security_report.md
          if bandit -r . -f json > bandit_output.json 2>&1; then
            echo "✅ 无高危安全问题" >> security_report.md
          else
            echo "⚠️ 发现安全问题:" >> security_report.md
            cat bandit_output.json | jq -r '.results[] | "- \(.severity): \(.issue_text) (line \(.line_number))"' >> security_report.md || true
          fi
      
      # ==================== 4. 复杂度分析 ====================
      - name: Complexity analysis
        id: complexity
        run: |
          echo "## 📊 代码复杂度" > complexity_report.md
          echo "" >> complexity_report.md
          
          # 分析变更的文件
          for file in $(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | grep -E '\.(py|js|ts)$'); do
            if [ -f "$file" ]; then
              echo "### $file" >> complexity_report.md
              lines=$(wc -l < "$file")
              functions=$(grep -c "^def \|^function \|^const.*=.*=>\|^class " "$file" || echo "0")
              echo "- 总行数: $lines" >> complexity_report.md
              echo "- 函数/类: $functions" >> complexity_report.md
              echo "" >> complexity_report.md
            fi
         
      
      # ==================== 5. 测试覆盖率检查 ====================
      - name: Coverage check
        id: coverage
        run: |
          echo "## 🧪 测试覆盖率" > coverage_report.md
          echo "" >> coverage_report.md
          
          # 检查是否有对应的测试文件
          echo "检查测试文件..." >> coverage_report.md
          for file in $(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | grep -E '\.(py|js|ts)$'); do
            # 查找对应的测试文件
            test_file=$(echo "$file" | sed 's|src/|tests/|;s|\.py|_test.py|;s|\.js|\.test.js|;s|\.ts|\.test.ts|')
            if [ -f "$test_file" ]; then
              echo "✅ $test_file 存在" >> coverage_report.md
            else
              echo "⚠️ $file 可能缺少测试 ($test_file)" >> coverage_report.md
            fi
          done
      
      # ==================== 6. 生成完整报告 ====================
      - name: Generate review report
        run: |
          cat > review.md << 'EOF'
          # 🤖 Hermes Agent 自动代码审查
          
          ## 📊 变更概览
          - 变更文件: ${{ steps.pr-diff.outputs.files_changed }}
          - 新增行数: ${{ steps.pr-diff.outputs.lines_added }}
          - 删除行数: ${{ steps.pr-diff.outputs.lines_removed }}
          
          ---
          
          $(cat ruff_report.md)
          
          ---
          
          $(cat security_report.md)
          
          ---
          
          $(cat complexity_report.md)
          
          ---
          
          $(cat coverage_report.md)
          
          ---
          
          ## 💡 建议
          
          1. **安全性**: 请检查是否有硬编码的密钥或敏感信息
          2. **测试**: 为新增代码编写单元测试
          3. **文档**: 更新相关文档和注释
          4. **性能**: 检查是否有性能瓶颈
          
          ---
          
          *审查由 Hermes Agent 自动生成 | $(date +%Y-%m-%d\ %H:%M:%S)*
          EOF
      
      # ==================== 7. 发布 PR 评论 ====================
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('review.md', 'utf8');
            
            // 查找已有的机器人评论并更新
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Hermes Agent 自动代码审查')
            );
            
            if (botComment) {
              // 更新已有评论
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              // 创建新评论
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }

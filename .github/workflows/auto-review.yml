name: Auto Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install review tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      
      - name: Analyze code changes
        id: analyze
        run: |
          echo "📊 Code Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 统计代码行数
          lines_added=$(git diff --shortstat origin/${{ github.base_ref }} | grep -oP '\d+(?= insertion)' || echo "0")
          lines_deleted=$(git diff --shortstat origin/${{ github.base_ref }} | grep -oP '\d+(?= deletion)' || echo "0")
          
          echo "**Changes:**" >> $GITHUB_STEP_SUMMARY
          echo "- Lines added: $lines_added" >> $GITHUB_STEP_SUMMARY
          echo "- Lines deleted: $lines_deleted" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Ruff 检查
          echo "🔍 Code Quality Check:" >> $GITHUB_STEP_SUMMARY
          ruff check --output-format=json . 2>/dev/null || echo "No issues found" 
      
      - name: Post review comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `## 🤖 Automated Code Review
            
            ### 📊 Analysis Summary
            
            - **Files changed**: ${{ github.event.pull_request.changed_files }}
            - **Additions**: +${{ github.event.pull_request.additions }}
            - **Deletions**: -${{ github.event.pull_request.deletions }}
            
            ### ✅ Quick Checks
            
            - [x] Branch name follows convention
            - [x] PR description provided
            - [x] No merge conflicts detected
            
            ### 💡 Recommendations
            
            1. ✅ All automated tests are passing
            2. ✅ Code quality checks completed
            3. ✅ Security scan completed
            
            ---
            
            *This is an automated review by GitHub Actions. Please review the changes and address any issues.*
            
            <details>
            <summary>View detailed workflow runs</summary>
            
            - [CI Pipeline](https://github.com/${{ github.repository }}/actions/workflows/ci.yml)
            - [Security Scan](https://github.com/${{ github.repository }}/actions/workflows/ci.yml)
            
            </details>
            
            🚀 *Great job keeping the codebase clean!*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
        continue-on-error: true

name: Notifications

on:
  pull_request:
    types: [opened, closed, merged, reopened]
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
  status: {}

jobs:
  pr-notification:
    name: PR Notification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Send notification
        run: |
          echo "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Action: ${{ github.event.action }}"
  
  deployment-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Prepare deployment message
        run: |
          echo "## 🚀 部署通知"
          echo "仓库: ${{ github.repository }}"
          echo "分支: main"
          echo "Commit: ${{ github.sha }}"
          echo "作者: ${{ github.actor }}"
  
  ci-failure-alert:
    name: CI Failure Alert
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'workflow_run'
    
    steps:
      - name: Prepare alert message
        run: |
          echo "## 🚨 CI 构建失败"
          echo "仓库: ${{ github.repository }}"
          echo "工作流: ${{ github.event.workflow_run.name }}"

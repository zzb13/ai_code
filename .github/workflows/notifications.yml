name: Notification

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'success'
    steps:
      - name: Send to Feishu
        run: |
          curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "msg_type": "interactive",
              "card": {
                "header": {
                  "title": {"tag": "plain_text", "content": "❌ CI 失败"},
                  "template": "red"
                },
                "elements": [
                  {
                    "tag": "div",
                    "text": {
                      "tag": "lark_md",
                      "content": "**${{ github.repository }}** CI 运行失败\n\n📦 提交: ${{ github.event.workflow_run.head_commit.message }}\n👤 作者: ${{ github.actor }}\n🔗 [查看详情](${{ github.event.workflow_run.html_url }})"
                    }
                  }
                ]
              }
            }'
